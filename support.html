<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支持我的开发 / Support Our Development</title>
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            /* 浅蓝色渐变背景，还原图片效果 */
            background: linear-gradient(180deg, #e3f2fd 0%, #bbdefb 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            color: #333;
        }

        /* 主标题样式 */
        .main-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 50px;
            text-align: center;
            color: #1a1a1a;
            letter-spacing: 1px;
        }

        /* 卡片容器 - 使用 Flexbox 布局 */
        .cards-container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap; /* 允许在小屏幕上换行 */
            justify-content: center;
            max-width: 1200px;
            width: 100%;
        }

        /* 单个卡片样式 */
        .card {
            background: white;
            border-radius: 20px;
            padding: 30px 20px;
            width: 300px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05); /* 柔和的阴影 */
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 鼠标悬停效果 */
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        }

        /* 卡片标题 (微信支付/支付宝等) */
        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #444;
        }

        /* 二维码图片样式 */
        .qr-code {
            width: 180px;
            height: 180px;
            object-fit: contain; /* 保持图片比例 */
            border-radius: 10px;
            margin-bottom: 20px;
            /* 给二维码加一点点内边距防止贴边，可选 */
            padding: 5px; 
        }

        /* PayPal 按钮样式 */
        .paypal-btn {
            background-color: #0070ba; /* PayPal 标准蓝 */
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            text-decoration: none;
            display: inline-block;
            width: 80%;
        }

        .paypal-btn:hover {
            background-color: #005ea6;
        }

        /* 底部感谢语 */
        .footer-text {
            margin-top: 50px;
            text-align: center;
            font-size: 1.2rem;
            color: #333;
            line-height: 1.6;
        }

        .footer-text .en {
            display: block;
            font-size: 1rem;
            color: #666;
            margin-top: 5px;
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .main-title {
                font-size: 1.8rem;
            }
            .cards-container {
                flex-direction: column;
                align-items: center;
            }
            .card {
                width: 100%;
                max-width: 320px;
            }
        }
    </style>
</head>
<body>

    <!-- 顶部标题 -->
    <h1 class="main-title">支持我的开发 / Support Our Development</h1>

    <!-- 中间卡片区域 -->
    <div class="cards-container">
        
        <!-- 1. 微信支付卡片 -->
        <div class="card">
            <h3 class="card-title">微信支付 / WeChat Pay</h3>
            <!-- 请在这里替换您的微信二维码图片链接 -->
            <img src="https://app.eblog.top/image/weixin.png?text=WeChat+QR" alt="WeChat Pay QR Code" class="qr-code">
        </div>

        <!-- 2. 支付宝卡片 -->
        <div class="card">
            <h3 class="card-title">支付宝 / Alipay</h3>
            <!-- 请在这里替换您的支付宝二维码图片链接 -->
            <img src="https://app.eblog.top/image/zhifubao.png?text=Alipay+QR" alt="Alipay QR Code" class="qr-code">
        </div>

        <!-- 3. PayPal 卡片 -->
        <div class="card">
            <h3 class="card-title">PayPal</h3>
            <!-- 请在这里替换您的 PayPal 二维码图片链接 -->
            <img src="https://app.eblog.top/image/paypal.png?text=PayPal+QR" alt="PayPal QR Code" class="qr-code">
            
            <!-- PayPal 支付链接按钮 -->
            <a href="https://www.paypal.com/ncp/payment/E3KMAPWSR2X3S" target="_blank" class="paypal-btn">
                Pay with PayPal
            </a>
        </div>

    </div>

    <!-- 底部感谢语 -->
    <div class="footer-text">
        Thank you for your generous support!
        <span class="en">感谢您的慷慨支持！</span>
    </div>

</body>
</html>
